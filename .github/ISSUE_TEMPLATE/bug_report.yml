name: Bug report
description: Report a problem with Claude Code Session Manager
labels: ["bug"]
body:
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Session Manager version (Settings > About, or `npm view claude-code-session-manager version` if installed via npx)
      placeholder: "0.103.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: cli-version
    attributes:
      label: Claude Code CLI version
      description: Output of `claude --version`
      placeholder: "1.2.3"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, in order?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
