name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      # e2e launches the PROD app (SM_E2E, not SM_DEV) → createWindow loads
      # dist/index.html (src/main/index.cjs:340-350), which hard-fails when dist
      # is missing. Build it before e2e or every test dies at launchApp.ts:56.
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: sudo apt-get install -y xvfb
      - run: npm run test:e2e
        env:
          SM_E2E: '1'
          SM_SUPERVISOR_DISABLE: '1'
          SM_MOCK_BILLING_KIND: 'ok'

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Vitest's experimental.fsModuleCache (vitest.config.ts) persists
      # transformed modules here across runs; restoring it per shard avoids
      # re-transforming all 601 files every CI run.
      - uses: actions/cache@v6
        with:
          path: node_modules/.experimental-vitest-cache
          key: vitest-fs-module-cache-${{ hashFiles('package-lock.json') }}-shard${{ matrix.shard }}
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  # Mac startup paths (Homebrew claude bin, /Users -> /System/Volumes/Data/Users
  # symlink, dock activation) were uncovered until v0.10.0 shipped broken.
  # This job boots the Electron app on a real macOS runner and asserts the
  # three boot pollers (billing/teams/schedule) settle before withTimeout fires.
  smoke-darwin:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run smoke:darwin
        env:
          SM_E2E: '1'
          SM_SUPERVISOR_DISABLE: '1'
          SM_MOCK_BILLING_KIND: 'ok'

  # Nothing proved the Windows port until this job: typecheck, the win32 unit
  # tests, then a boot of the packaged win-unpacked app.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx vitest run src/main/lib/__tests__/claudeBin-win32.test.cjs src/main/lib/__tests__/defaultShell.test.cjs src/main/lib/__tests__/killTree.test.cjs src/main/lib/__tests__/winPaths.test.cjs src/main/lib/__tests__/winSpawn.test.cjs src/main/lib/__tests__/openExternalApp-win32.test.cjs src/main/lib/__tests__/appRuntime.test.cjs src/main/lib/__tests__/prereqs.test.cjs
        shell: bash
      - run: node scripts/package/stage.cjs
        shell: bash
      - run: npx electron-builder --config electron-builder.yml --win dir --publish never
        shell: bash
      - run: npx playwright install chromium
        shell: bash
      - run: npm run smoke:packaged
        shell: bash
        env:
          SM_PACKAGED_BIN: release/out/win-unpacked/Session Manager.exe
