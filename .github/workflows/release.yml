name: Release
# Builds electron-builder installers on native runners and publishes them to the
# GitHub Release for the pushed v* tag. Windows ships both x64 and arm64 installers.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  # Creates the ONE draft release for the tag before the matrix runs. Matrix runners
  # upload into it (releaseType=draft) so they never race to create releases.
  create-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Create draft release if missing
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it"
          else
            gh release create "$TAG" --repo "$REPO" --draft --title "$TAG" --notes "Release $TAG"
          fi

  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-24.04
            script: dist:linux
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # Signing vars are exported to later steps ONLY when their secret is non-empty:
      # an empty CSC_LINK / APPLE_API_KEY reaches electron-builder as "" and resolves
      # as a path (the repo dir) -> "not a file". Secrets enter via this step's env only.
      - name: Export signing configuration
        shell: bash
        env:
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SECRET_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          SECRET_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          SECRET_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          SECRET_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          SECRET_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$SECRET_CSC_LINK" ]; then
              echo "CSC_LINK=$SECRET_CSC_LINK" >> "$GITHUB_ENV"
              if [ -n "$SECRET_CSC_KEY_PASSWORD" ]; then
                echo "CSC_KEY_PASSWORD=$SECRET_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
              fi
              if [ -n "$SECRET_APPLE_API_KEY" ] && [ -n "$SECRET_APPLE_API_KEY_ID" ] && [ -n "$SECRET_APPLE_API_ISSUER" ]; then
                KEY_FILE="$RUNNER_TEMP/AuthKey_$SECRET_APPLE_API_KEY_ID.p8"
                (umask 077; printf '%s\n' "$SECRET_APPLE_API_KEY" > "$KEY_FILE")
                echo "APPLE_API_KEY=$KEY_FILE" >> "$GITHUB_ENV"
                echo "APPLE_API_KEY_ID=$SECRET_APPLE_API_KEY_ID" >> "$GITHUB_ENV"
                echo "APPLE_API_ISSUER=$SECRET_APPLE_API_ISSUER" >> "$GITHUB_ENV"
                EXTRA="-c.mac.notarize=true"
              fi
            else
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
              echo "No CSC_LINK: building unsigned"
            fi
          elif [ "$RUNNER_OS" = "Windows" ]; then
            if [ -n "$SECRET_WIN_CSC_LINK" ]; then
              echo "WIN_CSC_LINK=$SECRET_WIN_CSC_LINK" >> "$GITHUB_ENV"
              if [ -n "$SECRET_WIN_CSC_KEY_PASSWORD" ]; then
                echo "WIN_CSC_KEY_PASSWORD=$SECRET_WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
              fi
            else
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
              echo "No WIN_CSC_LINK: building unsigned"
            fi
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
          echo "EXTRA_BUILDER_ARGS=$EXTRA" >> "$GITHUB_ENV"

      # Smoke runs against an unpacked app, before anything is published.
      - name: Build unpacked app (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:stage && npx electron-builder --config electron-builder.yml --mac dir --arm64 --publish never
      - name: Packaged smoke (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run smoke:packaged
        env:
          SM_PACKAGED_BIN: release/out/mac-arm64/Session Manager.app/Contents/MacOS/Session Manager
      - name: Build unpacked app (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: npm run dist:linux-dir
      - name: Install Playwright
        if: matrix.os == 'ubuntu-24.04'
        run: npx playwright install --with-deps chromium
      - name: Packaged smoke (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: xvfb-run --auto-servernum npm run smoke:packaged
        env:
          SM_PACKAGED_BIN: release/out/linux-unpacked/session-manager

      - name: Build unpacked app (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: npm run dist:stage && npx electron-builder --config electron-builder.yml --win dir --x64 --publish never
      - name: Packaged smoke (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: npm run smoke:packaged
        env:
          SM_PACKAGED_BIN: release/out/win-unpacked/Session Manager.exe

      - name: Build and publish installers
        shell: bash
        run: npm run ${{ matrix.script }} -- --publish always -c.publish.releaseType=draft $EXTRA_BUILDER_ARGS

  # Publishes the draft only after all three platform jobs succeeded.
  finalize-release:
    needs: release
    if: ${{ success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Publish draft release and mark latest
        run: gh release edit "$TAG" --repo "$REPO" --draft=false --latest

  # Publishes the npm package with npm Trusted Publishing (GitHub OIDC): no stored token,
  # so npm never stages the version for a manual 2FA approval (the local classic-token E409).
  # One-time human step on npmjs.com: package Settings -> Trusted Publisher -> GitHub Actions,
  # repository claude-code-session-manager, workflow release.yml.
  # Independent of the installer matrix: an installer failure never blocks the npm publish.
  npm-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      # Trusted Publishing needs npm CLI 11.5.1+.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Check package.json version matches the tag
        id: version
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version $PKG_VERSION does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
      - name: Skip if this version is already on npm
        id: published
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$NAME@$VERSION is already published; skipping npm publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # prepublishOnly builds the renderer; Trusted Publishing adds provenance automatically.
      - name: Publish to npm
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
