<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Session Manager — Hive & Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Geist:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #ece5d8; height: 100%; }
  * { box-sizing: border-box; }
  body { font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  #root { height: 100vh; }
  @keyframes hvPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .hv-pulse { animation: hvPulse 1.2s ease-in-out infinite; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: #d2c2a4; border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="variants/shared.jsx"></script>
<script type="text/babel" src="variants/almanac.jsx"></script>
<script type="text/babel" src="variants/hive-shared.jsx"></script>
<script type="text/babel" src="variants/hive-launch.jsx"></script>
<script type="text/babel" src="variants/hive-live.jsx"></script>
<script type="text/babel" src="variants/hive-config.jsx"></script>
<script type="text/babel" src="variants/hive.jsx"></script>
<script type="text/babel" src="variants/scheduler-data.jsx"></script>
<script type="text/babel" src="variants/scheduler.jsx"></script>

<script type="text/babel">
  function FullApp() {
    const [size, setSize] = React.useState({ w: window.innerWidth, h: window.innerHeight });
    React.useEffect(() => {
      const on = () => setSize({ w: window.innerWidth, h: window.innerHeight });
      window.addEventListener('resize', on);
      return () => window.removeEventListener('resize', on);
    }, []);
    const initial = (new URLSearchParams(location.search).get('tab')) || 'subagents';
    return <Almanac width={size.w} height={size.h} initialNav={initial} />;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<FullApp />);
</script>
</body>
</html>
