<!DOCTYPE html><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'"><script data-sm-player-bridge>(() => {
  var timer = null;
  var flag = false;
  var muted = false;
  const demo = () => { return window.smDemo || null; }
  const num = (v, d) => { return typeof v === 'number' && isFinite(v) ? v : d; }
  const call = (name, arg) => {
    var d = demo();
    if (d && typeof d[name] === 'function') { d[name](arg); return true; }
    return false;
  }
  const media = () => { return document.querySelectorAll('audio,video'); }
  const duration = () => {
    var d = demo();
    if (d) {
      var v = typeof d.duration === 'function' ? d.duration() : d.duration;
      if (typeof v === 'number' && isFinite(v) && v > 0) return v;
    }
    var m = document.querySelector('meta[name="sm-demo-duration"]');
    if (m) { var n = Number(m.getAttribute('content')); if (isFinite(n) && n > 0) return n; }
    var els = media();
    for (var i = 0; i < els.length; i++) { if (isFinite(els[i].duration) && els[i].duration > 0) return els[i].duration; }
    return 0;
  }
  const now = () => {
    var d = demo();
    if (d) {
      if (typeof d.getTime === 'function') return num(d.getTime(), 0);
      if (typeof d.t === 'number') return d.t;
      if (typeof d.time === 'number') return d.time;
    }
    var el = media()[0];
    return el ? num(el.currentTime, 0) : 0;
  }
  const playing = () => {
    var d = demo();
    if (d) {
      if (typeof d.isPlaying === 'function') return !!d.isPlaying();
      if (typeof d.playing === 'boolean') return d.playing;
    }
    return flag;
  }
  const scenes = () => {
    var d = demo();
    var out = [];
    var src = d && Array.isArray(d.scenes) ? d.scenes : [];
    for (var i = 0; i < src.length; i++) {
      var s = src[i] || {};
      var t = typeof s.t === 'number' ? s.t : s.start;
      var label = s.label != null ? s.label : s.title;
      if (typeof t === 'number' && isFinite(t)) out.push({ t: t, label: label == null ? '' : String(label) });
    }
    return out;
  }
  const snapshot = () => {
    return { smPlayer: 1, type: 'state', duration: duration(), t: now(), playing: playing(), muted: muted, scenes: scenes() };
  }
  const stopTimer = () => { if (timer !== null) { clearInterval(timer); timer = null; } }
  const reply = (src) => {
    if (!src || typeof src.postMessage !== 'function') return;
    var s = snapshot();
    src.postMessage(s, '*');
    if (!s.playing) stopTimer();
  }
  const startTimer = (src) => {
    stopTimer();
    timer = setInterval(() => { reply(src); }, 250);
  }
  const setMuted = (m) => {
    muted = m;
    var els = media();
    for (var i = 0; i < els.length; i++) els[i].muted = m;
    call('setMuted', m);
  }
  window.addEventListener('message', (e) => {
    var data = e && e.data;
    if (!data || typeof data !== 'object' || data.smPlayer !== 1) return;
    var cmd = data.cmd;
    if (cmd === 'play') {
      flag = true;
      if (!call('play')) { var el = media()[0]; if (el && typeof el.play === 'function') el.play(); }
    } else if (cmd === 'pause') {
      flag = false;
      if (!call('pause')) { var el2 = media()[0]; if (el2 && typeof el2.pause === 'function') el2.pause(); }
    } else if (cmd === 'restart') {
      flag = true;
      if (!call('restart')) { call('seek', 0); call('play'); }
    } else if (cmd === 'seek') {
      call('seek', num(data.t, 0));
    } else if (cmd === 'mute') {
      setMuted(true);
    } else if (cmd === 'unmute') {
      setMuted(false);
    } else if (cmd !== 'hello') {
      return;
    }
    reply(e.source);
    if (playing() && e.source) startTimer(e.source);
  });

  }
  let shown = true;
  DYN.push((t) => {
    const dt = t - t0, on = dt >= 0 && dt <= 3.4;
    if (!on && !shown) return;
    shown = on;
    ps.forEach((p) => {
      if (!on) { p.el.setAttribute('display', 'none'); return; }
      const x = x0 + p.vx * dt + Math.sin(dt * 5 + p.ph) * 9, y = y0 + p.vy * dt + 0.5 * 720 * dt * dt;
      p.el.setAttribute('display', 'inline');
      p.el.setAttribute('transform', `translate(${r1(x)} ${r1(y)}) rotate(${r1(p.r0 + p.vr * dt)})`);
    });
  });
};
burst(KS[8].g, 52.75, 0, -150, 26, 4242, -Math.PI / 2, 2.4, 520);

// ---- K10 closing card: "Try Session Manager free at bilko dot run." ----
pop(9, 55.0, 0.45, 640, 325, (g) => {
  const d = rr(250, 150, 780, 350, 22);
  mk('path', { d, fill: '#fff', stroke: 'none' }, g);
  sp(g, d, INK, 5);
}, { parent: card });
draw(9, 55.5, 56.6, letters('SESSION MANAGER', 640, 194, 56, { align: 'c', rot: -0.8 }), { stage: true, w: 7 });
draw(9, 56.6, 56.85, ['M330 282 Q640 304 950 276'], { stage: true, c: OR, w: 8 });
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const wipeText = (id, txt, y, size, weight, t0, t1, x0, x1) => {
  const cp = mk('clipPath', { id }, defs);
  const el = mk('text', { x: 640, y, 'text-anchor': 'middle', 'font-size': size, 'font-weight': weight, fill: INK, 'font-family': FONT, 'clip-path': `url(#${id})` }, card);
  el.textContent = txt;
  // The system font varies by platform: widen the wipe to the measured text so a wider font is never clipped.
  const tw = el.getComputedTextLength();
  if (tw > 0) { x0 = Math.min(x0, 640 - tw / 2); x1 = Math.max(x1, 640 + tw / 2); }
  const cr = mk('rect', { x: x0 - 10, y: y - size, width: 0, height: size * 1.5 }, cp);
  draw(9, t0, t1, [`M${x0} ${y + 6} L${x1} ${y + 6}`], { stage: true, guide: true });
  DYN.push((t) => { cr.setAttribute('width', r1((x1 - x0 + 20) * clamp((t - t0) / (t1 - t0)))); });
};
wipeText('cl1', 'Try it free at', 344, 30, 600, 56.85, 57.05, 535, 745);
wipeText('cl2', 'bilko.run/products/session-manager', 406, 34, 800, 57.05, 57.65, 296, 984);
draw(9, 57.65, 57.9, ['M300 426 Q640 438 980 424'], { stage: true, c: OR, w: 6 });
wipeText('cl3', 'Free app. Free guide.', 474, 26, 600, 57.9, 58.15, 505, 775);
draw(9, 58.15, 58.5, [...sparkle(990, 178, 14), ...sparkle(290, 470, 11)], { stage: true, w: 3.5 });
const confettiG = $('confetti');
burst(confettiG, 57.0, 300, 170, 34, 777, -Math.PI / 2 - 0.5, 1.5, 640);
burst(confettiG, 57.0, 980, 170, 34, 919, -Math.PI / 2 + 0.5, 1.5, 640);

// ---- marker pen: follows the stroke being drawn; lifts and travels between strokes ----
const markerG = $('marker');
const pen = mk('g', {}, markerG);
const penTip = mk('path', { d: 'M0 0 L-7 -18 L7 -18 Z', fill: INK, stroke: INK, 'stroke-width': 2, 'stroke-linejoin': 'round' }, pen);
mk('rect', { x: -12, y: -34, width: 24, height: 16, fill: '#fff', stroke: INK, 'stroke-width': 3 }, pen);
mk('rect', { x: -17, y: -158, width: 34, height: 126, rx: 9, fill: '#fff', stroke: INK, 'stroke-width': 3.5 }, pen);
mk('rect', { x: -17, y: -118, width: 34, height: 20, fill: OR, stroke: INK, 'stroke-width': 3 }, pen);
mk('rect', { x: -14, y: -172, width: 28, height: 16, rx: 6, fill: '#fff', stroke: INK, 'stroke-width': 3 }, pen);
STROKES.sort((a, b) => a.t0 - b.t0);
const T0S = STROKES.map((s) => s.t0);
const lastStarted = (t) => { let lo = 0, hi = T0S.length - 1, ans = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (T0S[m] <= t) { ans = m; lo = m + 1; } else hi = m - 1; } return ans; };
const REST = [1360, 860];
const idleOff = (p, dt) => { const u = easeOut(clamp(dt / 0.4)); return [p[0] + 26 * u, p[1] + 30 * u]; };
const markerAt = (t, cam) => {
  const j = lastStarted(t), cur = j >= 0 ? STROKES[j] : null;
  if (cur && t < cur.t1) {
    const q = cur.el.getPointAtLength(cur.len * clamp((t - cur.t0) / (cur.t1 - cur.t0)));
    return { p: toStage(cur, q.x + cur.ox, q.y + cur.oy, cam), lift: 0, c: cur.c };
  }
  const prevP = cur ? toStage(cur, cur.p1.x + cur.ox, cur.p1.y + cur.oy, cam) : REST, prevEnd = cur ? cur.t1 : -1;
  const nxt = STROKES[j + 1];
  if (nxt) {
    const win = Math.min(0.5, nxt.t0 - prevEnd);
    if (nxt.t0 - t <= win) {
      const u = easeIO(clamp(1 - (nxt.t0 - t) / win)), from = cur ? idleOff(prevP, nxt.t0 - win - prevEnd) : REST;
      const np = toStage(nxt, nxt.p0.x + nxt.ox, nxt.p0.y + nxt.oy, cam);
      return { p: [lerp(from[0], np[0], u), lerp(from[1], np[1], u)], lift: Math.sin(Math.PI * u) * 16, c: nxt.c };
    }
  }
  if (cur && !nxt) {
    // After the last stroke the pen leaves the board so the closing card reads clean.
    const ip = idleOff(prevP, t - prevEnd), u = easeIO(clamp((t - prevEnd - 0.3) / 0.9));
    return { p: [lerp(ip[0], REST[0], u), lerp(ip[1], REST[1], u)], lift: 8, c: cur.c };
  }
  return { p: cur ? idleOff(prevP, t - prevEnd) : REST, lift: cur ? 8 * easeOut(clamp((t - prevEnd) / 0.4)) : 0, c: cur ? cur.c : INK };
};

// ---- captions (black on white, orange accent) ----
const CAPS = [
  [0.5, 5.0, 'What if Claude Code worked like a small team, just for you?'],
  [5.8, 8.94, 'Claude Code is an AI helper that writes code.'],
  [8.94, 11.4, 'But it lives in a plain text window.'],
  [12.2, 15.13, 'Session Manager is a free desktop app.'],
  [15.13, 17.6, 'It gives Claude Code a friendly home.'],
  [18.4, 21.86, 'You say what you want. One helper plans it.'],
  [21.86, 25.2, 'Others build it. One more checks it.'],
  [26.0, 28.36, 'It keeps working while you are away.'],
  [28.36, 32.1, 'If you run low on usage, it waits, then picks back up.'],
  [32.9, 35.26, 'Each project gets its own tab.'],
  [35.26, 37.5, 'One page shows all your work.'],
  [38.3, 41.21, 'Tired of typing? Just talk.'],
  [41.21, 44.3, 'Your voice turns into text on your own computer.'],
  [45.1, 49.6, 'Away from your desk? Check on your work from your phone.'],
  [50.4, 54.6, 'You get a small team, and you stay in charge.'],
  [55.4, 60.01, 'Try Session Manager free at bilko.run'],
];
const capEl = $('cap'), capText = $('captext');
let capCur = -2;
const renderCap = (t) => {
  const i = CAPS.findIndex((c) => t >= c[0] && t < c[1]);
  if (i !== capCur) { capCur = i; capText.textContent = i >= 0 ? CAPS[i][2] : ''; }
  let op = 0;
  if (i >= 0) {
    const c = CAPS[i], chained = CAPS[i + 1] && Math.abs(CAPS[i + 1][0] - c[1]) < 1e-6;
    op = clamp((t - c[0]) / 0.18);
    if (!chained && c[1] < D) op = Math.min(op, clamp((c[1] - t) / 0.18));
  }
  capEl.style.opacity = op.toFixed(3);
};

// ---- one render = one exact frame for time t ----
let T = 0;
const progFill = $('progfill');
const render = (t) => {
  T = clamp(t, 0, D);
  const cam = camAt(T);
  world.setAttribute('transform', `translate(640 360) scale(${cam.z.toFixed(4)}) translate(${r1(-cam.x)} ${r1(-cam.y)})`);
  for (const s of STROKES) {
    if (s.guide) continue;
    const p = clamp((T - s.t0) / (s.t1 - s.t0));
    if (p !== s.v) { s.v = p; s.el.style.opacity = p > 0 ? 1 : 0; s.el.style.strokeDashoffset = r1((s.len + 1) * (1 - p)); }
  }
  for (const f of FILLS) { const p = clamp((T - f.t0) / (f.t1 - f.t0)); if (p !== f.v) { f.v = p; f.rect.setAttribute('width', r1(f.w * easeIO(p))); } }
  for (const q of POPS) {
    let s = easeBack(clamp((T - q.t0) / q.dur));
    if (q.t2 != null && T >= q.t2) s *= 1 - easeIO(clamp((T - q.t2) / 0.25));
    if (s !== q.v) {
      q.v = s;
      if (s <= 0.001) q.g.setAttribute('display', 'none');
      else { q.g.setAttribute('display', 'inline'); q.g.setAttribute('transform', `translate(${q.px} ${q.py}) rotate(${q.rot}) scale(${s.toFixed(3)}) translate(${-q.px} ${-q.py})`); }
    }
  }
  DYN.forEach((f) => f(T));
  const m = markerAt(T, cam);
  pen.setAttribute('transform', `translate(${r1(m.p[0])} ${r1(m.p[1] - m.lift)}) rotate(28) scale(0.85)`);
  penTip.setAttribute('fill', m.c); penTip.setAttribute('stroke', m.c);
  renderCap(T);
  progFill.style.width = ((T / D) * 100).toFixed(2) + '%';
};

// ---- player: one clock (requestAnimationFrame), audio slaved to it ----
const audio = $('vo'), btnPlay = $('bPlay'), soundBtn = $('bSound'), stage = $('stage');
const RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let playing = false, baseT = 0, baseNow = 0, raf = 0;
// Reduced motion: a static, steppable storyboard. Each scene shows fully drawn; narration can still play.
let rmKey = -1;
const showStatic = (t) => {
  const x = clamp(t, 0, D), k = keyAt(Math.min(x, D - 0.001));
  if (k !== rmKey) { rmKey = k; render(KS[k].e - 0.02); }
  T = x;
  if (playing) renderCap(x);
  else {
    // Paused storyboard: show every caption of this scene at once, so no line is lost.
    capCur = -3;
    capText.textContent = CAPS.filter((c) => c[0] >= KS[k].s && c[0] < KS[k].e).map((c) => c[2]).join(' ');
    capEl.style.opacity = 1;
  }
  markerG.style.display = 'none';
  $('sbl').textContent = `Scene ${k + 1} of ${KS.length}: ${KS[k].label}`;
  progFill.style.width = ((x / D) * 100).toFixed(2) + '%';
};
const show = (t) => (RM ? showStatic(t) : render(t));
const setBtn = () => { btnPlay.textContent = playing ? '❚❚' : '▶'; $('sbPlay').textContent = playing ? '❚❚' : '▶'; };
const tick = () => {
  raf = 0;
  if (!playing) return;
  let t = baseT + (performance.now() - baseNow) / 1000;
  if (t >= D) { show(D); pause(); return; }
  if (!audio.paused && Math.abs(audio.currentTime - t) > 0.25) audio.currentTime = t;
  show(t);
  raf = requestAnimationFrame(tick);
};
const pause = () => {
  playing = false;
  audio.pause();
  soundBtn.style.display = 'none';
  if (raf) { cancelAnimationFrame(raf); raf = 0; }
  setBtn();
};
const play = () => {
  if (playing) return;
  if (T >= D - 0.02) T = 0;
  playing = true; baseT = T; baseNow = performance.now();
  try { audio.currentTime = T; } catch (e) { /* not seekable yet */ }
  const pr = audio.play();
  if (pr && typeof pr.then === 'function') pr.then(() => { soundBtn.style.display = 'none'; }).catch(() => { if (playing) soundBtn.style.display = 'block'; });
  setBtn();
  if (!raf) raf = requestAnimationFrame(tick);
};
const seek = (t) => {
  const x = clamp(Number(t) || 0, 0, D);
  if (playing) { baseT = x; baseNow = performance.now(); }
  try { audio.currentTime = x; } catch (e) { /* not seekable yet */ }
  show(x);
};
const restart = () => { seek(0); play(); };
btnPlay.addEventListener('click', () => (playing ? pause() : play()));
$('bRestart').addEventListener('click', restart);
$('sbPlay').addEventListener('click', () => (playing ? pause() : play()));
$('sbPrev').addEventListener('click', () => { pause(); seek(KS[Math.max(0, keyAt(T) - 1)].s); });
$('sbNext').addEventListener('click', () => { const k = keyAt(Math.min(T, D - 0.001)); if (k >= KS.length - 1) return; pause(); seek(KS[k + 1].s); });
$('prog').addEventListener('click', (e) => { const r = e.currentTarget.getBoundingClientRect(); seek(((e.clientX - r.left) / r.width) * D); });
soundBtn.addEventListener('click', () => {
  audio.muted = false;
  try { audio.currentTime = T; } catch (e) { /* not seekable yet */ }
  const pr = audio.play();
  if (pr && typeof pr.then === 'function') pr.then(() => { soundBtn.style.display = 'none'; }).catch(() => {});
});
const fit = () => {
  const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  stage.style.transform = `translate(${r1((window.innerWidth - 1280 * s) / 2)}px, ${r1((window.innerHeight - 720 * s) / 2)}px) scale(${s.toFixed(4)})`;
};
window.addEventListener('resize', fit);
fit();
window.smDemo = {
  duration: D,
  scenes: KS.map((k) => ({ t: k.s, label: k.label })),
  seek, play, pause, restart,
  getTime: () => T,
  isPlaying: () => playing,
  setMuted: (m) => { audio.muted = !!m; },
};
if (RM) { document.body.classList.add('rm'); showStatic(0); setBtn(); } else { render(0); play(); }
</script>
